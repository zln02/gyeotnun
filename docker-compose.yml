# 곁눈(Gyeotnun) 스택 (api + postgres + nginx + certbot)
# 로컬 개발: docker compose up --build            (nginx/certbot 없이 api:8000 직접 접속)
# 배포:      docker compose --profile prod up -d --build   (nginx 리버스 프록시까지 함께 기동)
# ★ .env 가 없어도 api 는 뜬다. 이때는 모든 요청에 ?mock=1 을 붙여 사용한다.
#
# nginx/certbot 은 "prod" 프로파일에만 속한다 - 로컬 개발 중에는 안 뜬다.
# 프론트는 vite dev 서버(5173)가 /api 를 8000 으로 직접 프록시하므로 로컬에선 필요 없다.
# 자세한 배포 절차는 deploy/README.md 참고.

services:
  api:
    build: ./api
    container_name: gyeotnun-api
    ports:
      # ★ 127.0.0.1 로만 바인딩한다. 0.0.0.0 이면 nginx 를 우회해 인터넷에서
      #   직접 :8000 으로 API 를 두드릴 수 있게 된다. 로컬 개발(vite 프록시,
      #   curl localhost:8000)과 nginx(같은 호스트에서 http://api:8000 으로
      #   도커 내부 네트워크를 통해 붙는다 - 이 포트 매핑과 무관)는 영향 없다.
      - "127.0.0.1:8000:8000"
    env_file:
      - .env                      # ★ 먼저 `cp .env.example .env` 를 실행할 것 (파일이 없으면 compose 가 멈춘다)
    environment:
      APP_ENV: local
      DATABASE_URL: postgresql+psycopg2://gyeotnun:gyeotnun@db:5432/gyeotnun
      MAX_UPLOAD_MB: 10
      # ★ 로컬 임베딩 모델 캐시 위치(2026-08-04). api/ 는 읽기-쓰기 마운트라
      #   컨테이너를 다시 만들어도 모델을 재다운로드하지 않는다.
      HF_HOME: /app/data/hf_cache
      # ★ 로컬 OCR(PaddleOCR) 모델 캐시 위치(api/data/paddle_home 마운트).
      #   HOME 을 여기로 두면 ~/.paddlex 가 캐시를 가리켜 재다운로드하지 않는다.
      HOME: /app/data/paddle_home
      PADDLE_PDX_CACHE_HOME: /app/data/paddle_home/.paddlex
      PADDLE_PDX_DISABLE_MODEL_SOURCE_CHECK: "True"
      # ★ OCR 제공자. 되돌리려면 이 값을 vision 으로 바꾸고 재시작(한 줄, 실측 6초).
      #   2026-08-06: 로컬 전환 후 S08(한글↔영문 공백 누락) 때문에 사칭 9/10 였으나
      #   경계 공백 보정(ocr._restore_boundary_spaces) 추가로 10/10 회복·정상 오판 0
      #   → local 채택. 문제 재발 시 vision 으로 한 줄 롤백.
      OCR_PROVIDER: local
    volumes:
      - ./api:/app                # 개발 중 핫리로드용
      - ./corpus:/corpus:ro       # 공공데이터 코퍼스 (읽기 전용)
    depends_on:
      db:
        condition: service_healthy
    # ★ 프로덕션: --reload 제거(파일 감시 오버헤드·의도치 않은 재시작 방지).
    #   워커는 1개로 고정한다 - checks 흐름이 프로세스 메모리(_MEMORY_STORE)에 의존해서,
    #   워커를 늘리면 create 한 워커와 evidence/dialogue 를 받는 워커가 달라져 404 가 난다.
    #   다중 워커로 늘리려면 그 저장소를 DB/Redis 로 먼저 옮겨야 한다(제출 후 과제).
    command: uvicorn main:app --host 0.0.0.0 --port 8000 --workers 1

  db:
    image: postgres:16-alpine
    container_name: gyeotnun-db
    environment:
      POSTGRES_USER: gyeotnun
      POSTGRES_PASSWORD: gyeotnun     # 로컬 전용 값. 운영에서는 반드시 시크릿으로 주입할 것.
      POSTGRES_DB: gyeotnun
    # ★ 호스트 포트를 노출하지 않는다. 외부 배포 시 기본 비밀번호(gyeotnun/gyeotnun) 그대로
    #   인터넷에 열어 두면 안 되기 때문이다. api 컨테이너는 내부 네트워크의 db:5432 로 붙는다.
    #   로컬에서 DB를 직접 열어보고 싶으면 `docker compose exec db psql -U gyeotnun` 사용.
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gyeotnun"]
      interval: 5s
      timeout: 3s
      retries: 10

  # ────────────────────────────────────────────── 배포 전용 (--profile prod)
  nginx:
    image: nginx:1.27-alpine
    container_name: gyeotnun-nginx
    profiles: ["prod"]
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./web/dist:/usr/share/nginx/html:ro
      # active.conf 는 http.conf 또는 https.conf 를 복사해 만든다(.gitignore 대상).
      # deploy/init-letsencrypt.sh 가 인증서 발급 후 자동으로 교체한다.
      - ./deploy/nginx/active.conf:/etc/nginx/conf.d/default.conf:ro
      - ./deploy/certbot/www:/var/www/certbot:ro
      - ./deploy/certbot/conf:/etc/letsencrypt:ro
    depends_on:
      - api

  certbot:
    image: certbot/certbot:latest
    container_name: gyeotnun-certbot
    profiles: ["prod"]
    restart: unless-stopped
    volumes:
      - ./deploy/certbot/www:/var/www/certbot
      - ./deploy/certbot/conf:/etc/letsencrypt
    # 12시간마다 갱신을 시도한다(공식 certbot 이미지 권장 패턴). 실제 갱신은 만료 30일
    # 전부터만 일어나므로 자주 돌려도 안전하다. nginx reload 는 별도 crontab 필요
    # (deploy/init-letsencrypt.sh 실행 후 출력되는 안내 참고).
    entrypoint: >
      sh -c "trap exit TERM; while :; do certbot renew --webroot -w /var/www/certbot; sleep 12h & wait $${!}; done"

volumes:
  pgdata:
