# 곁눈(Gyeotnun) 로컬 개발 스택 (api + postgres)
# 실행: docker compose up --build
# ★ .env 가 없어도 api 는 뜬다. 이때는 모든 요청에 ?mock=1 을 붙여 사용한다.

services:
  api:
    build: ./api
    container_name: gyeotnun-api
    ports:
      - "8000:8000"
    env_file:
      - .env                      # ★ 먼저 `cp .env.example .env` 를 실행할 것 (파일이 없으면 compose 가 멈춘다)
    environment:
      APP_ENV: local
      DATABASE_URL: postgresql+psycopg2://gyeotnun:gyeotnun@db:5432/gyeotnun
      MAX_UPLOAD_MB: 10
    volumes:
      - ./api:/app                # 개발 중 핫리로드용
      - ./corpus:/corpus:ro       # 공공데이터 코퍼스 (읽기 전용)
    depends_on:
      db:
        condition: service_healthy
    command: uvicorn main:app --host 0.0.0.0 --port 8000 --reload

  db:
    image: postgres:16-alpine
    container_name: gyeotnun-db
    environment:
      POSTGRES_USER: gyeotnun
      POSTGRES_PASSWORD: gyeotnun     # 로컬 전용 값. 운영에서는 반드시 시크릿으로 주입할 것.
      POSTGRES_DB: gyeotnun
    ports:
      - "5433:5432"    # 호스트 5432가 이미 사용 중이라 5433으로 매핑 (컨테이너 내부 통신은 db:5432 그대로 사용)
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gyeotnun"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
