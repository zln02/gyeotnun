# 곁눈(Gyeotnun) nginx 리버스 프록시 - HTTP 전용 단계
#
# DNS(gyeotnun.duckdns.org → 이 서버의 공인 IP)가 아직 전파되지 않았을 때 쓰는 설정이다.
# deploy/init-letsencrypt.sh 로 인증서 발급에 성공하면 https.conf 로 교체된다.
# (직접 활성화하는 파일은 deploy/nginx/active.conf 다 - .gitignore 대상,
#  최초 배포 시 이 파일을 복사해서 만든다. 자세한 건 deploy/README.md 참고)

server {
    listen 80;
    server_name gyeotnun.duckdns.org;

    client_max_body_size 11m;   # api 의 MAX_UPLOAD_MB=10 보다 살짝 여유를 둔다 -
    #   nginx 가 정확히 10m 에서 끊으면 앱의 친절한 "사진이 너무 큽니다" 안내(200+message)
    #   대신 nginx 기본 413 에러 페이지가 먼저 뜬다. 여기서는 극단적으로 큰 업로드만 막고,
    #   실제 10MB 경계 판단은 백엔드(routers/checks.py)가 하게 맡긴다.

    # Let's Encrypt HTTP-01 챌린지 - certbot 이 이 경로로 검증 파일을 요청한다
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location /api/ {
        proxy_pass http://api:8000/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /health {
        proxy_pass http://api:8000/health;
        proxy_set_header Host $host;
    }

    # 서비스 워커는 캐시되면 업데이트가 기기에 안 퍼진다 - 항상 최신본을 받게 한다
    location = /sw.js {
        add_header Cache-Control "no-cache";
        try_files /sw.js =404;
    }

    root /usr/share/nginx/html;
    index index.html;

    # 라우터 라이브러리를 쓰지 않는 단일 페이지 앱이라 항상 index.html 로 폴백한다
    location / {
        try_files $uri /index.html;
    }
}
