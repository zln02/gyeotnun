# 곁눈(Gyeotnun) nginx 리버스 프록시 - HTTP 전용 단계
#
# DNS(gyeotnun.duckdns.org → 이 서버의 공인 IP)가 아직 전파되지 않았을 때 쓰는 설정이다.
# deploy/init-letsencrypt.sh 로 인증서 발급에 성공하면 https.conf 로 교체된다.
# (직접 활성화하는 파일은 deploy/nginx/active.conf 다 - .gitignore 대상,
#  최초 배포 시 이 파일을 복사해서 만든다. 자세한 건 deploy/README.md 참고)

# ────────────────────────────────── DoS·남용 방어 (2026-08-06 보안 점검 반영)
# 값의 근거와 두 zone 을 나눈 이유는 https.conf 의 같은 블록 주석 참고
# (HSTS 는 평문 HTTP 단계에서는 의미가 없어 이 파일에는 넣지 않는다).
limit_req_zone  $binary_remote_addr zone=gyeotnun_llm:10m  rate=60r/m;  # AI 호출(비용) 엔드포인트
limit_req_zone  $binary_remote_addr zone=gyeotnun_api:10m  rate=20r/s;   # 그 외 API (계측 등 고빈도)
limit_conn_zone $binary_remote_addr zone=gyeotnun_conn:10m;

server_tokens off;

server {
    listen 80;
    server_name gyeotnun.duckdns.org;

    client_max_body_size 11m;   # api 의 MAX_UPLOAD_MB=10 보다 살짝 여유를 둔다 -
    #   nginx 가 정확히 10m 에서 끊으면 앱의 친절한 "사진이 너무 큽니다" 안내(200+message)
    #   대신 nginx 기본 413 에러 페이지가 먼저 뜬다. 여기서는 극단적으로 큰 업로드만 막고,
    #   실제 10MB 경계 판단은 백엔드(routers/checks.py)가 하게 맡긴다.

    # ── 느린 요청(Slowloris)·연결 고갈 방어
    client_body_timeout   15s;
    client_header_timeout 15s;
    send_timeout          15s;
    keepalive_timeout     30s;
    limit_conn gyeotnun_conn 100;

    # ── 보안 응답 헤더 (자체 add_header 를 가진 location 에는 상속되지 않아 그쪽에 다시 적는다)
    add_header X-Frame-Options        "DENY"        always;
    add_header X-Content-Type-Options "nosniff"     always;
    add_header Referrer-Policy        "same-origin" always;

    # Let's Encrypt HTTP-01 챌린지 - certbot 이 이 경로로 검증 파일을 요청한다
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # 비용이 큰 AI 호출 경로만 좁게 제한한다 (근거는 https.conf 주석 참고)
    location ~ ^/api/v1/checks(/[^/]+/(dialogue|verdict))?$ {
        limit_req zone=gyeotnun_llm burst=30 nodelay;
        limit_req_status 429;
        proxy_pass http://api:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    location ~ ^/(docs|redoc|openapi\.json)$ {
        return 404;
    }

    location /api/ {
        limit_req zone=gyeotnun_api burst=100 nodelay;
        limit_req_status 429;
        proxy_pass http://api:8000/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /health {
        proxy_pass http://api:8000/health;
        proxy_set_header Host $host;
    }

    # 서비스 워커는 캐시되면 업데이트가 기기에 안 퍼진다 - 항상 최신본을 받게 한다
    location = /sw.js {
        add_header Cache-Control "no-cache";
        # ★ 이 블록에 add_header 가 있으면 server 레벨 보안 헤더가 상속되지 않는다 - 다시 적는다.
        add_header X-Frame-Options        "DENY"        always;
        add_header X-Content-Type-Options "nosniff"     always;
        add_header Referrer-Policy        "same-origin" always;
        try_files /sw.js =404;
    }

    root /usr/share/nginx/html;
    index index.html;

    # ★ 빌드마다 파일명이 해시로 바뀐다(Vite). 존재하지 않는 옛 해시 자산 요청이
    #   아래 SPA 폴백에 걸리면 200 으로 index.html 을 돌려줘 버려서, 그걸 JS/CSS
    #   로 파싱하려는 브라우저가 조용히 죽는다(2026-08 실제 발생, https.conf·
    #   web/public/sw.js 참고). /assets/ 는 SPA 라우트가 아니므로 명시적으로
    #   404 를 내려 이 마스킹을 막는다.
    location /assets/ {
        try_files $uri =404;
    }

    # 라우터 라이브러리를 쓰지 않는 단일 페이지 앱이라 항상 index.html 로 폴백한다
    location / {
        try_files $uri /index.html;
    }
}
