# 곁눈(Gyeotnun) nginx 리버스 프록시 - HTTPS 단계
#
# deploy/init-letsencrypt.sh 가 인증서 발급에 성공한 뒤 이 파일을 active.conf 로
# 복사하고 nginx 를 reload 하면 활성화된다. 그 전에는 쓰이지 않는다.

# ────────────────────────────────── DoS·남용 방어 (2026-08-06 보안 점검 반영)
# conf.d/*.conf 는 nginx.conf 의 http{} 안에서 include 되므로 여기서 zone 을 선언할 수 있다.
#
# ★ 제한을 두 개로 나눈 이유: /api/ 전체에 같은 값을 걸면 계측(POST /events)이 먼저 막힌다.
#   계측은 화면 진입·이탈·클릭마다 발생해 한 세션에 수십 건이 나가는 반면, 비용이 드는 것은
#   AI를 부르는 소수 엔드포인트다. 막아야 할 것(비용·과부하)과 정상 트래픽을 갈라 놓는다.
# ★★ 기준이 IP 단위라는 점이 값을 정하는 데 결정적이다. 경로당·복지관·발표장처럼 여러
#   어르신이 같은 와이파이(= 하나의 공인 IP)를 쓰면, 빡빡하게 잡을수록 공격자보다 정상
#   사용자가 먼저 막힌다. 확인 1건이 약 5회 호출이므로 아래 값(60r/m + burst 30)은 한 IP
#   뒤에서 12명이 동시에 확인을 진행해도 걸리지 않는 수준이다.
# ★ 따라서 이 설정의 목적은 "비용 상한"이 아니라 "무제한 상태의 제거"다. 단일 IP 폭주와
#   느린 연결 고갈을 막아 주지만, IP 를 바꿔 가며 들어오는 공격은 막지 못한다.
#   진짜 비용 통제는 앱 레벨에서 해야 한다 - device_id 단위 제한 + 일일 총비용 상한
#   (docs/security/vulnerability_scan.md §8-4, review_2026-08.md H1). 그건 아직 없다.
limit_req_zone  $binary_remote_addr zone=gyeotnun_llm:10m  rate=60r/m;  # AI 호출(비용) 엔드포인트
limit_req_zone  $binary_remote_addr zone=gyeotnun_api:10m  rate=20r/s;  # 그 외 API (계측 등 고빈도)
limit_conn_zone $binary_remote_addr zone=gyeotnun_conn:10m;

server_tokens off;   # 응답 헤더·오류 페이지에서 nginx 버전을 숨긴다

server {
    listen 80;
    server_name gyeotnun.duckdns.org;

    # 갱신(renew) 도 HTTP-01 챌린지를 다시 쓰므로 이 경로는 HTTP 에서도 계속 열어 둔다
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name gyeotnun.duckdns.org;

    client_max_body_size 11m;   # api 의 MAX_UPLOAD_MB=10 보다 살짝 여유를 둔다 -
    #   nginx 가 정확히 10m 에서 끊으면 앱의 친절한 "사진이 너무 큽니다" 안내(200+message)
    #   대신 nginx 기본 413 에러 페이지가 먼저 뜬다. 여기서는 극단적으로 큰 업로드만 막고,
    #   실제 10MB 경계 판단은 백엔드(routers/checks.py)가 하게 맡긴다.

    ssl_certificate     /etc/letsencrypt/live/gyeotnun.duckdns.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/gyeotnun.duckdns.org/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    # ── 전송 압축 (2026-08-06 성능 점검: 번들 246KB 가 무압축으로 나가고 있었다)
    #   시니어 사용자는 모바일 회선이 많아 전송량이 곧 첫 화면 체감이다. gzip 으로
    #   JS/CSS 가 약 1/3(246KB→77KB)로 줄어든다. 이미지(png/jpg/webp)는 이미 압축돼
    #   있어 대상에서 뺀다 - CPU 만 쓰고 이득이 없다.
    gzip              on;
    gzip_comp_level   5;      # 5 면 압축률·CPU 균형점(6 이상은 이득 대비 CPU 급증)
    gzip_min_length   1024;   # 1KB 미만은 헤더 오버헤드가 더 크다
    gzip_proxied      any;
    gzip_vary         on;     # 프록시·CDN 이 압축/무압축을 따로 캐시하도록
    gzip_types        text/plain text/css application/javascript application/json
                      application/manifest+json image/svg+xml;


    # ── 느린 요청(Slowloris)·연결 고갈 방어
    #   타임아웃 값은 "읽기와 읽기 사이 간격"의 상한이지 전체 전송 시간이 아니다.
    #   모바일에서 10MB 사진을 천천히 올리는 경우에도 15초 간격이면 넉넉하다.
    client_body_timeout   15s;
    client_header_timeout 15s;
    send_timeout          15s;
    keepalive_timeout     30s;
    limit_conn gyeotnun_conn 100;   # 공용 와이파이(단일 IP) 뒤 다수 사용자를 고려한 값

    # ── 보안 응답 헤더
    #   X-Frame-Options: 곁눈을 iframe 에 넣고 투명 버튼을 덮어 판단 버튼(따라한다/안 한다)
    #   클릭을 가로채는 공격을 막는다. 이 서비스에서는 클릭 조작이 곧 잘못된 안내가 나가는
    #   것과 같은 결과라, 일반 사이트보다 영향이 크다.
    #   ★ add_header 는 하위 location 에 add_header 가 하나라도 있으면 상속되지 않는다.
    #     그래서 자체 add_header 를 가진 location = /sw.js 에도 아래 헤더를 다시 적어 둔다.
    add_header X-Frame-Options           "DENY"           always;
    add_header X-Content-Type-Options    "nosniff"        always;
    add_header Referrer-Policy           "same-origin"    always;
    add_header Strict-Transport-Security "max-age=31536000" always;

    # ── 비용이 큰 AI 호출 경로만 따로 좁게 제한한다.
    #   POST /checks(이미지 인식) · /checks/{id}/dialogue(질문 생성) · /checks/{id}/verdict.
    #   확인 1건이 약 5회 호출이라 60r/m + burst 30 이면 정상 사용은 걸리지 않는다.
    #   정규식 location 은 접두어 location 보다 먼저 매칭되므로 아래 /api/ 보다 우선한다.
    location ~ ^/api/v1/checks(/[^/]+/(dialogue|verdict))?$ {
        limit_req zone=gyeotnun_llm burst=30 nodelay;
        limit_req_status 429;
        proxy_pass http://api:8000;     # 정규식 location 이라 URI 를 그대로 넘긴다
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # 질문 생성은 검증 실패 시 최대 3회까지 재생성하므로 응답이 길어질 수 있다.
        proxy_read_timeout 120s;
    }

    # API 문서·스키마(/docs, /openapi.json)는 외부에 노출할 이유가 없다.
    # 지금은 /api/ 와 /health 만 프록시되어 어차피 도달하지 않지만, 나중에 프록시 규칙이
    # 넓어져도 새지 않도록 명시적으로 막아 둔다.
    location ~ ^/(docs|redoc|openapi\.json)$ {
        return 404;
    }

    location /api/ {
        limit_req zone=gyeotnun_api burst=100 nodelay;   # 계측(events)은 한 세션에 수십 건 나간다
        limit_req_status 429;
        proxy_pass http://api:8000/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /health {
        proxy_pass http://api:8000/health;
        proxy_set_header Host $host;
    }

    location = /sw.js {
        add_header Cache-Control "no-cache";
        # ★ 이 블록에 add_header 가 있으면 server 레벨 보안 헤더가 상속되지 않는다 - 다시 적는다.
        add_header X-Frame-Options           "DENY"           always;
        add_header X-Content-Type-Options    "nosniff"        always;
        add_header Referrer-Policy           "same-origin"    always;
        add_header Strict-Transport-Security "max-age=31536000" always;
        try_files /sw.js =404;
    }

    root /usr/share/nginx/html;
    index index.html;

    # ★ 빌드마다 파일명이 해시로 바뀐다(Vite). 구버전 서비스워커·브라우저 캐시가
    #   들고 있는 옛 index.html 이 이미 삭제된 옛 해시 파일을 요청할 수 있는데,
    #   아래 공용 SPA 폴백(location /)에 걸리면 존재하지 않는 .js/.css 요청에도
    #   200 으로 index.html 을 돌려줘 버린다 - 브라우저가 그 HTML 을 JS 로 파싱
    #   하려다 조용히 죽어 화면이 아예 안 뜨는 사고로 이어진다(2026-08 실제 발생,
    #   web/public/sw.js 참고). /assets/ 는 SPA 라우트가 아니므로 명시적으로
    #   404 를 내려 이 마스킹을 막는다.
    location /assets/ {
        # ★ 파일명에 내용 해시가 박혀 있다(index-XXXX.js). 내용이 바뀌면 이름이 바뀌므로
        #   영구 캐시가 안전하다. 재방문 시 246KB 재다운로드가 사라진다.
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    location / {
        try_files $uri /index.html;
    }
}
