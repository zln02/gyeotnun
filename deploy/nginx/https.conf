# 곁눈(Gyeotnun) nginx 리버스 프록시 - HTTPS 단계
#
# deploy/init-letsencrypt.sh 가 인증서 발급에 성공한 뒤 이 파일을 active.conf 로
# 복사하고 nginx 를 reload 하면 활성화된다. 그 전에는 쓰이지 않는다.

server {
    listen 80;
    server_name gyeotnun.duckdns.org;

    # 갱신(renew) 도 HTTP-01 챌린지를 다시 쓰므로 이 경로는 HTTP 에서도 계속 열어 둔다
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name gyeotnun.duckdns.org;

    client_max_body_size 11m;   # api 의 MAX_UPLOAD_MB=10 보다 살짝 여유를 둔다 -
    #   nginx 가 정확히 10m 에서 끊으면 앱의 친절한 "사진이 너무 큽니다" 안내(200+message)
    #   대신 nginx 기본 413 에러 페이지가 먼저 뜬다. 여기서는 극단적으로 큰 업로드만 막고,
    #   실제 10MB 경계 판단은 백엔드(routers/checks.py)가 하게 맡긴다.

    ssl_certificate     /etc/letsencrypt/live/gyeotnun.duckdns.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/gyeotnun.duckdns.org/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    location /api/ {
        proxy_pass http://api:8000/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /health {
        proxy_pass http://api:8000/health;
        proxy_set_header Host $host;
    }

    location = /sw.js {
        add_header Cache-Control "no-cache";
        try_files /sw.js =404;
    }

    root /usr/share/nginx/html;
    index index.html;

    # ★ 빌드마다 파일명이 해시로 바뀐다(Vite). 구버전 서비스워커·브라우저 캐시가
    #   들고 있는 옛 index.html 이 이미 삭제된 옛 해시 파일을 요청할 수 있는데,
    #   아래 공용 SPA 폴백(location /)에 걸리면 존재하지 않는 .js/.css 요청에도
    #   200 으로 index.html 을 돌려줘 버린다 - 브라우저가 그 HTML 을 JS 로 파싱
    #   하려다 조용히 죽어 화면이 아예 안 뜨는 사고로 이어진다(2026-08 실제 발생,
    #   web/public/sw.js 참고). /assets/ 는 SPA 라우트가 아니므로 명시적으로
    #   404 를 내려 이 마스킹을 막는다.
    location /assets/ {
        try_files $uri =404;
    }

    location / {
        try_files $uri /index.html;
    }
}
